name: Cookie Code Studio checks

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Build frontend
        run: npm run build
      - name: Build Pages Functions
        run: npx wrangler pages functions build functions --compatibility-date 2026-08-04 --compatibility-flag nodejs_compat
