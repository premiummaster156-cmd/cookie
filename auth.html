<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171412">
<title>Sign in — Cookie</title>
<link rel="icon" href="cookie-ai-icon.png" type="image/svg+xml">
<link rel="stylesheet" href="auth.css">
</head>
<body>
<main class="auth-shell">
  <a class="auth-brand" href="index.html"><img src="cookie-ai-icon.png" alt="" width="38" height="38"><strong>Cookie</strong></a>
  <section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-icon"><img src="cookie-ai-icon.png" alt="" width="42" height="42"></div>
    <h1 id="auth-title">Welcome back</h1>
    <p class="auth-subtitle" id="authSubtitle">Sign in to continue to Cookie.</p>

    <div class="auth-tabs" role="tablist">
      <button class="auth-tab active" type="button" data-auth-mode="login">Sign in</button>
      <button class="auth-tab" type="button" data-auth-mode="signup">Create account</button>
    </div>

    <form id="authForm" novalidate>
      <label class="field"><span>Name</span><input id="name" name="name" autocomplete="name" placeholder="Your name" hidden></label>
      <label class="field"><span>Email</span><input id="email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required></label>
      <label class="field"><span>Password</span><input id="password" name="password" type="password" autocomplete="current-password" placeholder="At least 8 characters" minlength="8" required></label>
      <label class="remember"><input id="remember" type="checkbox" checked><span>Keep me signed in</span></label>
      <button class="auth-submit" type="submit"><span id="submitText">Sign in</span><span class="arrow">→</span></button>
      <p class="auth-error" id="authError" role="alert" hidden></p>
    </form>

    <div class="divider"><span>or</span></div>
    <button class="secondary-auth" type="button" id="guestBtn">Continue without an account</button>
    <p class="auth-note">Account creation is currently a frontend flow. Secure server authentication can be connected when the auth provider is configured.</p>
  </section>
  <p class="auth-footer">Cookie · AI workspace</p>
</main>
<script>
(() => {
  const $ = s => document.querySelector(s);
  let mode = 'login';
  const form = $('#authForm'), name = $('#name'), email = $('#email'), password = $('#password');
  const title = $('#auth-title'), subtitle = $('#authSubtitle'), submit = $('#submitText'), error = $('#authError');
  document.querySelectorAll('[data-auth-mode]').forEach(btn => btn.addEventListener('click', () => {
    mode = btn.dataset.authMode;
    document.querySelectorAll('[data-auth-mode]').forEach(x => x.classList.toggle('active', x === btn));
    const signup = mode === 'signup';
    name.hidden = !signup;
    name.required = signup;
    name.closest('.field').classList.toggle('hidden', !signup);
    title.textContent = signup ? 'Create your account' : 'Welcome back';
    subtitle.textContent = signup ? 'Create your Cookie account to save your workspace.' : 'Sign in to continue to Cookie.';
    submit.textContent = signup ? 'Create account' : 'Sign in';
    password.autocomplete = signup ? 'new-password' : 'current-password';
    error.hidden = true;
  }));
  form.addEventListener('submit', e => {
    e.preventDefault();
    error.hidden = true;
    if (!form.checkValidity()) { form.reportValidity(); return; }
    const account = {
      name: (name.value || email.value.split('@')[0]).trim(),
      email: email.value.trim().toLowerCase(),
      signedIn: true,
      createdAt: new Date().toISOString()
    };
    localStorage.setItem('cookie_account', JSON.stringify(account));
    window.location.href = 'index.html';
  });
  $('#guestBtn').addEventListener('click', () => {
    localStorage.setItem('cookie_guest', '1');
    window.location.href = 'index.html';
  });
})();
</script>
</body>
</html>
