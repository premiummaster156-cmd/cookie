<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#171412">
<title>Sign in — Cookie</title>
<link rel="icon" href="cookie-ai-icon.png" type="image/svg+xml">
<link rel="stylesheet" href="auth.css">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
<main class="auth-shell">
  <a class="auth-brand" href="index.html" aria-label="Cookie home">
    <img src="cookie-ai-icon.png" alt="" width="34" height="34">
    <strong>Cookie</strong>
  </a>

  <section class="auth-card" aria-labelledby="auth-title">
    <div class="auth-heading">
      <div class="auth-icon"><img src="cookie-ai-icon.png" alt="" width="44" height="44"></div>
      <div>
        <p class="auth-kicker">COOKIE</p>
        <h1 id="auth-title">Welcome back</h1>
        <p id="authSubtitle">Sign in to continue to Cookie.</p>
      </div>
    </div>

    <div class="auth-tabs" role="tablist" aria-label="Account">
      <button class="auth-tab active" type="button" data-auth-mode="login">Sign in</button>
      <button class="auth-tab" type="button" data-auth-mode="signup">Create account</button>
    </div>

    <form id="authForm" novalidate>
      <label class="field hidden" id="nameField">
        <span>Name</span>
        <input id="name" name="name" autocomplete="off" placeholder="Your name">
      </label>

      <label class="field">
        <span>Email</span>
        <input id="email" name="email" type="email" autocomplete="off" placeholder="you@example.com" required>
      </label>

      <label class="field">
        <span>Password</span>
        <input id="password" name="password" type="password" autocomplete="new-password" placeholder="At least 8 characters" minlength="8" required>
      </label>

      <div class="form-meta">
        <span class="form-note" id="formNote">Use the email linked to your Cookie account.</span>
        <button class="forgot" type="button" id="forgotBtn">Forgot password?</button>
      </div>

      <button class="auth-submit" type="submit">
        <span id="submitText">Sign in</span>
        <span class="arrow" aria-hidden="true">→</span>
      </button>
      <p class="auth-error" id="authError" role="alert" hidden></p>
    </form>

    <p class="auth-note">We use your email only for account verification and password recovery.</p>
  </section>

  <div class="error-modal-backdrop" id="errorModal" hidden>
    <section class="error-modal" role="alertdialog" aria-modal="true" aria-labelledby="errorModalTitle" aria-describedby="errorModalMessage">
      <div class="error-modal-icon" aria-hidden="true">!</div>
      <p class="error-modal-kicker">COOKIE</p>
      <h2 id="errorModalTitle">Something went wrong</h2>
      <p id="errorModalMessage">We couldn't complete that request.</p>
      <div class="error-modal-actions">
        <button type="button" class="error-cancel" id="errorCancel">Cancel</button>
        <button type="button" class="error-retry" id="errorRetry">Retry</button>
      </div>
    </section>
  </div>

  <p class="auth-footer">Cookie · AI workspace</p>
</main>

<script>
(() => {
  const SUPABASE_URL = 'https://imnsdbqricehgncpobda.supabase.co';
  const SUPABASE_PUBLISHABLE_KEY = 'sb_publishable_0mQKl_lds4N017Zhcn8JfQ_PwmTCvRi';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_PUBLISHABLE_KEY);

  const $ = s => document.querySelector(s);
  let mode = 'login';
  const form = $('#authForm');
  const name = $('#name');
  const email = $('#email');
  const password = $('#password');
  const title = $('#auth-title');
  const subtitle = $('#authSubtitle');
  const submit = $('#submitText');
  const error = $('#authError');
  const nameField = $('#nameField');
  const params = new URLSearchParams(location.search);
  const formNote = $('#formNote');
  const errorModal = $('#errorModal');
  const errorModalMessage = $('#errorModalMessage');
  const errorCancel = $('#errorCancel');
  const errorRetry = $('#errorRetry');
  let retryAction = null;

  function closeErrorModal() {
    errorModal.hidden = true;
    document.body.classList.remove('modal-open');
    retryAction = null;
  }

  function showErrorModal(message, retry) {
    errorModalMessage.textContent = message || 'We could not complete that request.';
    retryAction = retry || null;
    errorModal.hidden = false;
    document.body.classList.add('modal-open');
  }

  errorCancel.addEventListener('click', closeErrorModal);
  errorRetry.addEventListener('click', async () => {
    const action = retryAction;
    closeErrorModal();
    if (action) await action();
  });
  errorModal.addEventListener('click', event => {
    if (event.target === errorModal) closeErrorModal();
  });

  function showMessage(message, success = false) {
    error.hidden = false;
    error.className = success ? 'auth-success' : 'auth-error';
    error.textContent = message;
  }

  function recoveryFlow() {
    return location.hash.includes('type=recovery') || params.get('recovery') === '1';
  }

  function setMode(nextMode) {
    mode = nextMode;
    document.querySelectorAll('[data-auth-mode]').forEach(x => x.classList.toggle('active', x.dataset.authMode === nextMode));
    const signup = nextMode === 'signup';
    nameField.classList.toggle('hidden', !signup);
    $('#forgotBtn').hidden = signup;
    name.required = signup;
    email.required = nextMode !== 'reset';
    password.autocomplete = signup || nextMode === 'reset' ? 'new-password' : 'current-password';

    if (nextMode === 'reset') {
      title.textContent = 'Set a new password';
      subtitle.textContent = 'Choose a new password for your Cookie account.';
      email.closest('.field').classList.add('hidden');
      nameField.classList.add('hidden');
      name.required = false;
      email.required = false;
      submit.textContent = 'Update password';
      $('#forgotBtn').hidden = true;
      formNote.textContent = 'Enter a new password for your Cookie account.';
      return;
    }

    email.closest('.field').classList.remove('hidden');
    formNote.textContent = signup ? 'Use an email you can access to verify your account.' : 'Use the email linked to your Cookie account.';
    title.textContent = signup ? 'Create your account' : 'Welcome back';
    subtitle.textContent = signup ? 'Create your Cookie account.' : 'Sign in to continue to Cookie.';
    submit.textContent = signup ? 'Create account' : 'Sign in';
    error.hidden = true;
  }

  async function submitAuth() {
    error.hidden = true;

    if (mode === 'reset') {
      if (password.value.length < 8) {
        showErrorModal('Your new password must be at least 8 characters.', submitAuth);
        return;
      }
      submit.textContent = 'Updating…';
      try {
        const { error: updateError } = await supabase.auth.updateUser({ password: password.value });
        if (updateError) throw updateError;
        await supabase.auth.signOut();
        location.href = 'auth.html?reset=success';
      } catch (err) {
        submit.textContent = 'Update password';
        showErrorModal(err.message, submitAuth);
      }
      return;
    }

    if (!form.checkValidity()) {
      form.reportValidity();
      return;
    }

    submit.textContent = mode === 'signup' ? 'Creating…' : 'Signing in…';

    try {
      if (mode === 'signup') {
        const { data, error: signupError } = await supabase.auth.signUp({
          email: email.value.trim(),
          password: password.value,
          options: {
            data: { full_name: name.value.trim() },
            emailRedirectTo: location.origin + '/auth.html'
          }
        });
        if (signupError) throw signupError;
        password.value = '';
        showMessage(data.session
          ? 'Account created. You are signed in.'
          : 'Verification email sent. Check your inbox before signing in.', true);
        submit.textContent = 'Create account';
      } else {
        const { error: loginError } = await supabase.auth.signInWithPassword({
          email: email.value.trim(),
          password: password.value
        });
        if (loginError) throw loginError;
        location.href = 'index.html';
      }
    } catch (err) {
      submit.textContent = mode === 'signup' ? 'Create account' : 'Sign in';
      showErrorModal(err.message, submitAuth);
    }
  }

  document.querySelectorAll('[data-auth-mode]').forEach(btn => btn.addEventListener('click', () => {
    if (recoveryFlow()) return;
    setMode(btn.dataset.authMode);
  }));

  form.addEventListener('submit', async e => {
    e.preventDefault();
    await submitAuth();
  });

  $('#forgotBtn').addEventListener('click', async () => {
    const value = email.value.trim();
    if (!value) {
      email.focus();
      showMessage('Enter your email first.');
      return;
    }
    try {
      const { error: resetError } = await supabase.auth.resetPasswordForEmail(value, {
        redirectTo: location.origin + '/auth.html'
      });
      if (resetError) throw resetError;
      showMessage('If that email has a Cookie account, reset instructions have been sent.', true);
    } catch (err) {
      showErrorModal(err.message, () => $('#forgotBtn').click());
    }
  });

  if (params.get('reset') === 'success') {
    showMessage('Password updated. You can sign in now.', true);
  }

  async function boot() {
    const { data: { session } } = await supabase.auth.getSession();
    if (recoveryFlow()) {
      setMode('reset');
      if (session) password.focus();
      return;
    }
    if (params.get('verified') === '1') showMessage('Email verified. You can sign in now.', true);
    if (session) location.replace('index.html');
    else setMode('login');
  }

  supabase.auth.onAuthStateChange((event) => {
    if (event === 'PASSWORD_RECOVERY') setMode('reset');
  });

  boot();
})();
</script>
</body>
</html>
